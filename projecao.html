<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Projeção</title>
<style>
  :root{
    --bg: #0B0F14;
    --surface: #131A22;
    --border: #24303C;
    --text: #E5EAF0;
    --muted: #7C8A9A;
    --green: #6EE7A8;
    --pink: #F472B6;
    --blue: #7DD3FC;
    --amber: #FBBF24;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{
    height:100%;
    background:
      radial-gradient(ellipse at 50% 100%, #101820 0%, var(--bg) 60%);
    overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  }
  #campo{
    position:relative;width:100vw;height:100vh;
  }
  .grade{
    position:absolute;inset:0;
    background-image:
      linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
    background-size:48px 48px;
    pointer-events:none;
  }
  .cabecalho{
    position:absolute;top:28px;left:36px;
    font-family:ui-monospace,"JetBrains Mono","SFMono-Regular",Menlo,Consolas,monospace;
    color:var(--muted);
    font-size:14px;
    letter-spacing:.02em;
    pointer-events:none;
  }
  .cabecalho .cursor{
    display:inline-block;width:8px;height:16px;
    background:var(--green);
    margin-left:2px;vertical-align:middle;
    animation:piscar 1s steps(1) infinite;
  }
  @keyframes piscar{50%{opacity:0;}}

  .chip{
    position:absolute;
    white-space:nowrap;
    font-family:ui-monospace,"JetBrains Mono","SFMono-Regular",Menlo,Consolas,monospace;
    font-weight:600;
    padding:6px 14px;
    border-radius:999px;
    border:1px solid;
    background:rgba(19,26,34,.55);
    backdrop-filter:blur(2px);
    will-change:transform,opacity;
    pointer-events:none;
  }

  .qr-painel{
    position:absolute;bottom:28px;right:28px;
    width:168px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:10px;
    padding:14px;
    text-align:center;
    box-shadow:0 12px 40px rgba(0,0,0,.5);
  }
  .qr-painel p{
    font-family:ui-monospace,monospace;
    font-size:11px;
    color:var(--muted);
    margin-bottom:10px;
  }
  .qr-painel img{
    width:100%;height:auto;
    border-radius:6px;
    background:#fff;
    display:block;
  }
  .qr-url{
    display:none;
    font-family:ui-monospace,monospace;
    font-size:12px;
    color:var(--blue);
    word-break:break-all;
    margin-top:6px;
  }

  .demo-aviso{
    position:absolute;bottom:14px;left:14px;
    font-family:ui-monospace,monospace;
    font-size:11px;
    color:var(--amber);
    opacity:.6;
    display:none;
  }

  .btn-limpar{
    position:absolute;top:24px;right:32px;
    font-family:ui-monospace,"JetBrains Mono","SFMono-Regular",Menlo,Consolas,monospace;
    font-size:12px;
    color:var(--muted);
    background:rgba(19,26,34,.6);
    border:1px solid var(--border);
    border-radius:6px;
    padding:8px 14px;
    cursor:pointer;
    opacity:.5;
    transition:opacity .15s, color .15s, border-color .15s, background .15s;
  }
  .btn-limpar:hover{opacity:1;}
  .btn-limpar.a-confirmar{
    opacity:1;
    color:var(--pink);
    border-color:var(--pink);
    background:rgba(244,114,182,.1);
  }
</style>
</head>
<body>
<div id="campo">
  <div class="grade"></div>
  <div class="cabecalho">apresentação<span class="cursor"></span></div>

  <div class="qr-painel">
    <p>manda a tua ideia</p>
    <img id="qrImg" src="/qrcode.png" alt="QR code"
         onerror="this.style.display='none'; document.getElementById('qrFallback').style.display='block';">
    <div class="qr-url" id="qrFallback"></div>
  </div>

  <div class="demo-aviso" id="demoAviso">modo demonstração — sem ligação ao servidor</div>

  <button class="btn-limpar" id="btnLimpar" title="atalho: tecla L">limpar ecrã</button>
</div>

<script>
  const campo = document.getElementById('campo');
  const qrFallback = document.getElementById('qrFallback');
  const demoAviso = document.getElementById('demoAviso');

  // Mostra o link de acesso como reserva, caso o /qrcode.png ainda não exista
  qrFallback.textContent = window.location.origin + '/';

  // ---- Paleta das palavras (inspirada em syntax highlighting) ----
  const CORES = ['#6EE7A8', '#F472B6', '#7DD3FC', '#FBBF24'];

  // ---- Motor de animação ----
  const ativos = [];

  // Palavras "vivas": continuam a reaparecer em loop até serem limpas.
  // chave = id da palavra, valor = texto
  const banco = new Map();

  function gerarChip(texto, id){
    const el = document.createElement('div');
    el.className = 'chip';
    el.textContent = texto;

    const cor = CORES[Math.floor(Math.random() * CORES.length)];
    el.style.color = cor;
    el.style.borderColor = cor + '55';

    const tamanho = 18 + Math.random() * 20; // 18–38px
    el.style.fontSize = tamanho + 'px';

    campo.appendChild(el);

    const largura = el.offsetWidth;
    const x0 = 6 + Math.random() * (100 - 12); // % dentro do ecrã

    ativos.push({
      el,
      id,
      texto,
      x0,
      amp: 3 + Math.random() * 5,           // amplitude do desvio horizontal (%)
      freq: 0.4 + Math.random() * 0.5,      // frequência do balanço
      fase: Math.random() * Math.PI * 2,
      inicio: performance.now(),
      duracao: 11000 + Math.random() * 6000, // 11–17s a atravessar o ecrã
    });
  }

  function animar(agora){
    for(let i = ativos.length - 1; i >= 0; i--){
      const p = ativos[i];
      const t = (agora - p.inicio) / p.duracao;

      if(t >= 1){
        p.el.remove();
        ativos.splice(i, 1);
        // se a palavra ainda estiver "viva", volta a lançá-la depois
        // de uma pequena pausa aleatória, com um percurso novo
        if(banco.has(p.id)){
          setTimeout(() => gerarChip(p.texto, p.id), 300 + Math.random() * 2500);
        }
        continue;
      }

      const y = 108 - t * 118; // de baixo (108%) até acima do topo (-10%)
      const x = p.x0 + Math.sin(t * Math.PI * 2 * p.freq + p.fase) * p.amp;

      // fade in/out suave nas pontas do percurso
      let opacidade = 1;
      if(t < 0.08) opacidade = t / 0.08;
      else if(t > 0.85) opacidade = (1 - t) / 0.15;

      p.el.style.transform = `translate(${x}vw, ${y}vh)`;
      p.el.style.opacity = opacidade;
    }
    requestAnimationFrame(animar);
  }
  requestAnimationFrame(animar);

  // ---- Ligação ao backend ----
  let ultimoId = 0;
  let modoDemo = false;

  async function verificarNovasPalavras(){
    try{
      const resp = await fetch(`/palavras?since=${ultimoId}`);
      if(!resp.ok) throw new Error('resposta inválida');
      const novas = await resp.json();

      if(modoDemo){ modoDemo = false; demoAviso.style.display = 'none'; }

      novas.forEach(item => {
        banco.set(item.id, item.texto);
        gerarChip(item.texto, item.id);
        if(item.id > ultimoId) ultimoId = item.id;
      });
    }catch(err){
      ativarModoDemo();
    }
  }

  // Gera palavras de exemplo para pré-visualizar a animação
  // sem precisares de ligar o backend primeiro.
  const PALAVRAS_DEMO = [
    'recursividade', 'API', 'loop infinito', 'git commit', 'bug',
    'array', 'refactor', 'func()', 'debug', 'algoritmo',
    '404', 'try/catch', 'variável', 'deploy', 'stack overflow'
  ];

  function ativarModoDemo(){
    if(modoDemo) return;
    modoDemo = true;
    demoAviso.style.display = 'block';
    agendarProximaDemo();
  }

  function agendarProximaDemo(){
    if(!modoDemo) return;
    setTimeout(() => {
      if(!modoDemo) return;
      const palavra = PALAVRAS_DEMO[Math.floor(Math.random() * PALAVRAS_DEMO.length)];
      gerarChip(palavra);
      agendarProximaDemo();
    }, 1200 + Math.random() * 1800);
  }

  setInterval(verificarNovasPalavras, 1500);
  verificarNovasPalavras();

  // ---- Limpar ecrã ----
  const btnLimpar = document.getElementById('btnLimpar');
  let aConfirmar = false;
  let temporizadorConfirmar = null;

  async function limparEcra(){
    // esvazia o banco: as palavras já em voo terminam a animação
    // atual mas não voltam a reaparecer
    banco.clear();

    // remove imediatamente tudo o que está visível
    ativos.forEach(p => p.el.remove());
    ativos.length = 0;

    // esvazia também no servidor, para um refresh não trazer as palavras de volta
    try{
      await fetch('/limpar', { method: 'POST' });
    }catch(err){
      // se o servidor não tiver a rota /limpar ainda, o ecrã fica
      // limpo à mesma, só não fica persistente entre refrescos
    }
    ultimoId = 0;
  }

  function cliqueLimpar(){
    if(!aConfirmar){
      aConfirmar = true;
      btnLimpar.textContent = 'confirmar limpeza?';
      btnLimpar.classList.add('a-confirmar');
      temporizadorConfirmar = setTimeout(() => {
        aConfirmar = false;
        btnLimpar.textContent = 'limpar ecrã';
        btnLimpar.classList.remove('a-confirmar');
      }, 3000);
      return;
    }
    clearTimeout(temporizadorConfirmar);
    aConfirmar = false;
    btnLimpar.textContent = 'limpar ecrã';
    btnLimpar.classList.remove('a-confirmar');
    limparEcra();
  }

  btnLimpar.addEventListener('click', cliqueLimpar);
  document.addEventListener('keydown', (e) => {
    if(e.key === 'l' || e.key === 'L') cliqueLimpar();
  });
</script>
</body>
</html>
